<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            /* border: 1px solid red; */
            width: 100vh;
            height: 100%;
        }

        .all {
            margin-top: -50px;
            color: gray;

        }

        /* 로그인창 박스생성 */
        .order {
            border: 1px solid lightblue; 
            width: 90%;
            max-width: 600px;
            height: 100%;
            /* margin: 300px 460px; */
            padding-left: 170px;
            box-shadow: 10px 0px 20px 2px;
            border-radius: 20px;
            background-color: #F8FEB5;

        }

        


        h1 {
            border: 1px solid red;
            width: 50%;
            margin: 10% 10%;
            color: darkorange;
            font-size: 55px;
        }

        /* 체크박스를 생성 */
        .checkbox {
            /* border: solid red; */
            /* margin-top: -40px; */
            margin: -13.5% 20% -7% -280%;
            margin-left: -101%;
            transform: scale(2.0); /*박스크기를 키워주는 역할*/
            display: flex;
            font-size: 23%;
        }

        /* 체크박스 옆에 글씨를 생성함 */
        p {
            /* border: 1px solid red; */
            width: 111%;
            margin: -11% 20% 6% -95%;
            font-size: 23px;
            cursor: pointer;
            color: black;
        }


        /* 아이디와 비번을 생성 */
        .ppt {
            width: 103%;
            height: 45px;
            font-size: 23px;
            /* margin: 10px -100px 20px; */
            margin: 1% -1% 5% -20%;
        }

        /* 아이디와 비번의 테두리 색깔을 바꾼것 */
        .ppt:focus {
            outline: none;
            border: 3px solid darkgoldenrod;
        }

        /* 아이디 비번 찾기 회원가입 박스생성 */
        .linkbox {
            /* border: 1px solid red; */
            width: 101%;
            margin-left: -15%;
        }

        /* 아이디와 비밀번호찾기를 생성*/
        .link {
            /* border: 1px solid red; */
            /* margin: 10px 20px 10px 10px; */
            margin: 20% 20% 20% -17%;
            cursor: pointer;
            font-size: 25px;
            color: black;
        }

         /* 로그인버튼 생성 */
         /* .btn1 {
            font-size: 23px;
            height: 50px;
            width: 530px;
            margin-left: -100px;
            margin-top: 20px;
            margin-bottom: 30px;
            cursor: pointer;
        } */

        /* 로그인버튼 생성 */
        .btn1 {
            font-size: 23px;
            height: 50px;
            width: 104%;
            margin-left: -20%;
            margin-top: 3%;
            margin-bottom: 6%;
            cursor: pointer;
        }

        /* 회원가입을 버튼으로 만드는것 */
        .pol {
            /* 1. 위쪽 2.오른쪽 3.아래쪽 4.왼쪽 */
            /* 3개일때 1.위쪽 2.오왼 3.아래 이렇게 적용된다  */
            margin: 0% -5% 10%;
            width: 103%;
            height: 48px;
            font-size: 20px;
        }

        /* 아이디 비번 찾기의 밑줄을 만든것 */
        .link:hover {
            text-decoration: underline;
        }

        /* 회원가입에 손가락모양으로 바꿔줬음 */
        .pol:hover {
            cursor: pointer;
        }
        .linkparent{
            margin: -1% 0% 9% 41%;
            
        }
    </style>

</head>

<body>


    <div class="order">
        <div class="all">

            <h1>지역유치원</h1>
            <input type="text" class="ppt" placeholder="아이디">
            <input type="text" class="ppt" placeholder="비밀번호">

            <div class="linkparent">
            <span class="link">아이디찾기</span>
            <span class="link">비밀번호찾기</span>
            <label>
                <p>아이디 저장</p>
                <input type="checkbox" class="checkbox">
            </label>

            </div>
            
            <button class="btn1">로그인</button>

            <div class="linkbox">
                <button class="pol">회원가입</button>
                
            </div>
        </div>
    </div>
</body>
</html>
