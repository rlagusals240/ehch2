<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
     <script>
        window.addEventListener('load', ()=>{})
        window.onload = ()=>{}

        
            $(()=>{
               function init(){
                const list_h1 = $('h1')
                console.log( list_h1 )
                console.log( list_h1 [0] )
               }
            })


            console.log( $('h1') )
            // querySelectorAll에 해당
            // text()는 innerText
            $('h1').text('싹다 변경')

            $('h1').html('<a href="javascript:void(0)">a tag</a>')// 이건 장애인들을 위한 코딩
            // $('h1').html('<a href="#">a tag</a>') 이걸 써도된다
            // html()은 innerHTML에 해당

            // 클래스 추가
            console.log( $('#parent') ).addClass('c1')
            console.log( $('#parent') ).addClass('c2')

            // 클래스 제거
            $('#parent').removeClass('c1 c2')

            // 클래스 있으면 제거, 없으면 추가
            $('#parent').toggleClass('c2')
            // console.log( $('#parent') ).addClass('c2 c3')// 이것도 알아서 들어간다

            // 클래스가 있는지 확인 true/false
           console.log( $('#parent').hasClass('c2') )

           // 전달인자가 하나면
           //  getAttrivbute 속성의 값 가져오기
           let human = $('#chk').attr('data-human')
           console.log( human )
           $('#chk').attr('data-human')
           // 전달인자가 두개면
           // setAttribute
           $('#chk').attr('data-human', '123')
           $('#chk').attr('data-game','윷놀이')

           // data() : data-속성명 에서 속성명만 사용할 수 있다
           console.log( $('#chk').data('game') )
             // 개발자도구에서 안본이는 속성 추가
            $('#chk').data('dinner','찌개')
            console.log($('#chk').data('dinner'))
        //    console.log( $('#chk').data('dinner','찌개') )

            // removeAttribute 속성 삭제
            $('#chk').removeAttr('data-game')

            // $('#parent').append('')
            // $()안에 html 태그를 넣으면
            // createElement 해줌
            
            let div = ($('<div class="child2">자식2</div>'))
            console.log( child2[0] )

            // 자식의 마지막에 요소 추가
            $('#parent').append(child2)

            $('#parent').prepend('<div class="child3">자식3</div>')
            // $('#parent').prepend('<div class="child3">자식3</div>')
            $('#parent').after('<div id="parent2">parent2</div>')
            $('#parent').before('<div id="parent3">parent3</div>')

            // 내용 비우기
            // $('#parent')[0].innerHTML = ""
            // $('#parent').html('')
            $('#parent').empty()

            // 태그 삭제 본인까지 삭제
            $('#parent').remove()

            </script>
</head>
<body>
        <h1>첫번째</h1>
        <h1>두번째</h1>
        <h1>세번째</h1>

        <div id="parent">
            부모
            <div class="child1">자식</div>
        </div>

        <input type="checbox" id="chk" class="cb1" value="1"
                data-human="값" checked="checked"><br>
</body>
</html>
